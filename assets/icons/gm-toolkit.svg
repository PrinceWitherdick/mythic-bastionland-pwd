<!-- The Referee Toolkit's portrait: somebody reading behind an open book, which is what the toolkit is.
     The same mark as the Stonetop system's GM Toolkit, in this system's ink and parchment.

     Sourced from game icons dot net ("read", by Skoll, https://game-icons.net/1x1/skoll/read.html),
     CC BY 3.0 (https://creativecommons.org/licenses/by/3.0/), artwork unchanged. Only the ground
     under it is ours: a parchment disc showing past an ink field as a hairline rim, so the mark
     keeps its edge on Foundry's dark sidebar. The README credits it too.

     An XML comment may not hold two hyphens in a row: an SVG loaded through an img tag is parsed
     strictly, and one stray pair breaks the whole picture. -->
